#
# Medical Scribe as a standalone suite app. Run with `make up` (see README.md); REGISTRY=false builds
# the app images from source.
#
#   gateway            the only published port: UI at /, API at /api
#   ui                 Next.js, presentation only
#   scribe-aggregator  the Medical Scribe API: encounters, pipeline, live, SOAP note, metrics
#   encounter-store    encounters and doctor profiles (SQLite)
#   speech-to-text     intel/audio-analyzer: Whisper + pyannote speakers  GPU / NPU / CPU
#   text-generation    OpenVINO Model Server, model loaded at start     GPU / NPU / CPU
#   metrics-collector  performance-tools: CPU, GPU, NPU, memory, power  (host network, privileged)
#
# Models and devices: configs/model-config.yaml (read by each AI service at start).

name: medical-scribe

x-proxy-env: &proxy-env
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  HTTP_PROXY: ${http_proxy:-}
  HTTPS_PROXY: ${https_proxy:-}
  no_proxy: localhost,127.0.0.1,speech-to-text,text-generation,encounter-store,scribe-aggregator,ui,gateway,model-download
  NO_PROXY: localhost,127.0.0.1,speech-to-text,text-generation,encounter-store,scribe-aggregator,ui,gateway,model-download

x-accelerators: &accelerators
  devices:
    - /dev/dri:/dev/dri
    - ${NPU_DEVICE:-/dev/null}:/dev/accel/accel0
  group_add:
    - "${RENDER_GID:-992}"
    - "${VIDEO_GID:-44}"

x-service: &service
  restart: unless-stopped
  init: true
  networks: [scribe]

networks:
  scribe:
    name: medical-scribe

services:
  gateway:
    <<: *service
    image: ${REGISTRY_URL:-intel/}hl-ai-medical-scribe-gateway:${TAG:-latest}
    build:
      context: ./services/gateway
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-8080}:8080"
    depends_on:
      ui:
        condition: service_healthy
      scribe-aggregator:
        condition: service_healthy

  ui:
    <<: *service
    image: ${REGISTRY_URL:-intel/}hl-ai-medical-scribe-ui:${TAG:-latest}
    build:
      context: ./services/ui
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}

  scribe-aggregator:
    <<: *service
    image: ${REGISTRY_URL:-intel/}hl-ai-medical-scribe-aggregator:${TAG:-latest}
    build:
      context: ./services/scribe-aggregator
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    environment:
      METRICS_URL: http://host.docker.internal:9000
      MODEL_CONFIG: /configs/model-config.yaml
    volumes:
      - ./configs:/configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      encounter-store:
        condition: service_healthy

  encounter-store:
    <<: *service
    image: ${REGISTRY_URL:-intel/}hl-ai-medical-scribe-encounter-store:${TAG:-latest}
    build:
      context: ./services/encounter-store
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    volumes:
      - ${DATA_DIR:-./data}/encounter-store:/data

  speech-to-text:
    <<: [*service, *accelerators]
    # OEP audio-analyzer with whole-file diarization and speaker profiles (edge-ai-libraries
    # feature/audio-analyzer-speaker-profiles); services/speech-to-text/entrypoint.sh applies
    # configs/model-config.yaml.
    image: intel/audio-analyzer:${AUDIO_ANALYZER_TAG:-medical-scribe}
    entrypoint: ["/bin/sh", "/opt/scribe/entrypoint.sh"]
    environment:
      <<: *proxy-env
      HF_TOKEN: ${HF_TOKEN:-}
      AUDIO_ANALYZER_SERVER_PORT: "8002"
    volumes:
      - ./services/speech-to-text/entrypoint.sh:/opt/scribe/entrypoint.sh:ro
      - ./libs/scripts/model_config.py:/opt/scribe/model_config.py:ro
      - ./configs:/configs:ro
      # Whisper and pyannote snapshots, the Whisper OpenVINO export; the root model-download writes to.
      - ${MODELS_DIR:-./models}:/app/audio_analyzer/models
      # Uploaded audio per request: clinical data, kept on the host data folder, not in the container.
      - ${DATA_DIR:-./data}/speech-to-text:/app/audio_analyzer/storage
    healthcheck:
      # The port opens only once the model is exported, loaded and warmed up.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First start downloads Whisper and exports it to OpenVINO.
      start_period: 20m

  text-generation:
    <<: [*service, *accelerators]
    # Official OpenVINO Model Server image; services/text-generation/entrypoint.sh applies
    # configs/model-config.yaml.
    image: openvino/model_server:${OVMS_TAG:-2026.4.1-gpu}
    # The uid audio-analyzer also runs as, so both can write the host models folder.
    user: "1000:1000"
    entrypoint: ["/bin/bash", "/opt/scribe/entrypoint.sh"]
    environment:
      <<: *proxy-env
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./services/text-generation/entrypoint.sh:/opt/scribe/entrypoint.sh:ro
      - ./configs:/configs:ro
      - ${MODELS_DIR:-./models}/text-generation:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8004/v2/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First start downloads the model.
      start_period: 30m
    # Loading the LLM while Whisper also initialises the GPU can crash OVMS: one after the other.
    depends_on:
      speech-to-text:
        condition: service_healthy

  model-download:
    # OEP model-download, only for `make download-models`: speech-to-text and libs/scripts/download_llm.py
    # download the models in configs/model-config.yaml through it into the host models folder.
    <<: *service
    profiles: [download]
    image: intel/model-download:${MODEL_DOWNLOAD_TAG:-2026.3.0-rc2}
    restart: "no"
    command: ["--plugins", "huggingface"]
    user: "1000:1000"
    environment:
      <<: *proxy-env
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${MODELS_DIR:-./models}:/opt/models
      - ./configs:/configs:ro
      - ./libs/scripts/download_llm.py:/opt/scribe/download_llm.py:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Installs its plugin dependencies when it starts.
      start_period: 10m

  metrics-collector:
    # performance-tools (intel-retail/performance-tools), as multi_modal_patient_monitoring uses it:
    # CPU / GPU / NPU / memory / power over HTTP on :9000. Needs the host's /sys and /proc.
    image: intel/retail-benchmark:${METRICS_TAG:-2026.3.0-rc2}
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    environment:
      NPU_LOG: /tmp/results/npu_usage.csv
      RESULTS_DIR: /tmp/results
      QMASSA_CYCLE_SECONDS: "180"
    volumes:
      - ${METRICS_DIR:-./metrics}:/tmp/results
      - /sys/devices:/sys/devices
      - /dev/dri:/dev/dri:rw
      - /sys/class/drm:/sys/class/drm:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/proc
