#
# Medical Scribe as containers, one per service. Run through the Makefile (`make up`), which
# creates docker/.env first.
#
# Host networking: every service binds 127.0.0.1 and the browser opens the live-mode WebSockets
# straight to the speech-to-text and diarization ports, so they stay on fixed host ports. The app
# (ui) runs them as EXTERNAL_SERVICES: it neither spawns nor stops them. Their ports must be in the
# app's instance port range (8100-8199), the only ports it probes and proxies to; 8190-8193 sit at
# the top, clear of the ports it hands out to instances it does start.

name: medical-scribe

x-build: &build
  context: ..
  dockerfile: docker/Dockerfile
  args:
    http_proxy: ${http_proxy:-}
    https_proxy: ${https_proxy:-}
    no_proxy: ${no_proxy:-}

x-service: &service
  network_mode: host
  restart: unless-stopped
  init: true
  devices:
    - /dev/dri:/dev/dri
    - ${NPU_DEVICE:-/dev/null}:/dev/accel/accel0
  group_add:
    - "${RENDER_GID:-992}"
    - "${VIDEO_GID:-44}"
  volumes:
    - ${MODELS_DIR:-../models}:/opt/medical-scribe/models
    - ${DATA_DIR:-../data}:/opt/medical-scribe/data
    - ${LOGS_DIR:-../logs}:/opt/medical-scribe/logs
  environment: &environment
    http_proxy: ${http_proxy:-}
    https_proxy: ${https_proxy:-}
    no_proxy: ${no_proxy:-},localhost,127.0.0.1
    HF_TOKEN: ${HF_TOKEN:-}
    HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}

x-workers-image: &workers-image ${REGISTRY:-}medical-scribe-workers:${TAG:-latest}

services:
  speech-to-text:
    <<: *service
    image: ${REGISTRY:-}medical-scribe-stt:${TAG:-latest}
    build:
      <<: *build
      target: stt
    command:
      - python
      - main.py
      - --port=${STT_PORT:-8190}
      - --model=${STT_MODEL:-openai/whisper-large-v3-turbo}
      - --device=${STT_DEVICE:-GPU}
      - --precision=${STT_PRECISION:-int8}
      - --instance-id=speech-to-text
      - --data-dir=/opt/medical-scribe/data/speech-to-text/speech-to-text
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${STT_PORT:-8190}/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First start exports Whisper to OpenVINO.
      start_period: 20m

  diarization:
    <<: *service
    image: *workers-image
    build:
      <<: *build
      target: workers
    working_dir: /opt/medical-scribe/workers/services/diarization
    command:
      - /opt/medical-scribe/workers/.venv/bin/python
      - main.py
      - --port=${DIARIZATION_PORT:-8191}
      - --device=${DIARIZATION_DEVICE:-cpu}
      - --source=huggingface
      - --instance-id=speaker-diarization
      - --data-dir=/opt/medical-scribe/data/diarization/speaker-diarization
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${DIARIZATION_PORT:-8191}/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10m

  text-generation:
    <<: *service
    image: *workers-image
    build:
      <<: *build
      target: workers
    working_dir: /opt/medical-scribe/workers/engines/multiserve
    # Loading the LLM while Whisper also initialises the GPU can crash OVMS, so it waits for STT.
    depends_on:
      speech-to-text:
        condition: service_healthy
    # The model itself is loaded by the app (deployment.json / Runtime Settings) over /v1/start.
    command:
      - /opt/medical-scribe/workers/.venv/bin/python
      - app-hybrid.py
      - --port=${LLM_PORT:-8192}
      - --logs-dir=/opt/medical-scribe/logs/multiserve/text-generation/text-generation
      - --model-dir=/opt/medical-scribe/models/multiserve/text-generation
      - --instance-dir=/opt/medical-scribe/data/text-generation/text-generation
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${LLM_PORT:-8192}/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 2m

  medical-scribe-database:
    <<: *service
    image: *workers-image
    build:
      <<: *build
      target: workers
    working_dir: /opt/medical-scribe/workers/services/medical-scribe-database
    command:
      - /opt/medical-scribe/workers/.venv/bin/python
      - main.py
      - --port=${SCRIBE_DB_PORT:-8193}
      - --instance-id=medical-scribe-database
      - --data-dir=/opt/medical-scribe/data/medical-scribe-database/medical-scribe-database
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${SCRIBE_DB_PORT:-8193}/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1m

  ui:
    <<: *service
    image: ${REGISTRY:-}medical-scribe-ui:${TAG:-latest}
    build:
      <<: *build
      target: ui
    environment:
      <<: *environment
      PORT: ${UI_PORT:-8080}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?run make setup}
      APP_MODE: ${APP_MODE:-medical-scribe}
      DATABASE_URL: file:/opt/medical-scribe/data/ui/db.sqlite
      NEXT_MANUAL_SIG_HANDLE: "true"
      NEXT_EXIT_TIMEOUT_MS: "30000"
      EXTERNAL_SERVICES: >-
        speech-to-text=${STT_PORT:-8190},diarization=${DIARIZATION_PORT:-8191},text-generation=${LLM_PORT:-8192},medical-scribe-database=${SCRIBE_DB_PORT:-8193}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:${UI_PORT:-8080}/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 2m
    depends_on:
      medical-scribe-database:
        condition: service_healthy
      text-generation:
        condition: service_healthy
