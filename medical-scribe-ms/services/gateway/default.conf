#
# The single entry point: the UI at /, the Medical Scribe API at /api (including the live
# WebSocket and the streamed SOAP note). Nothing else is published.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Docker's DNS, re-asked every 10 s: a rebuilt ui or aggregator gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ui http://ui:3000;
    set $api http://scribe-aggregator:8000;

    client_max_body_size 200m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # The page needs the microphone (live consultations, voice enrolment) and nothing else.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Streamed notes and live sessions: no buffering, long reads.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass $ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
