<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Copyright (C) 2026 Intel Corporation. SPDX-License-Identifier: Apache-2.0 -->
  <title>Medical Scribe high-level architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0068b5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { rx: 12; ry: 12; stroke-width: 1.6; }
      .t { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #334155; }
      .m { font-size: 11px; fill: #475569; font-family: Consolas, Menlo, monospace; }
      .lbl { font-size: 11.5px; fill: #334155; }
      .pill { font-size: 10.5px; font-weight: 700; fill: #fff; }
    </style>
  </defs>

  <rect width="1400" height="880" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="42" font-size="24" font-weight="700" fill="#00285a">Medical Scribe — High-Level Architecture</text>
  <text x="30" y="66" font-size="13.5" fill="#475569">Standalone HLS suite app · Docker Compose (make up) · all AI on-device on Intel® Core™ Ultra (CPU · GPU · NPU)</text>

  <!-- Edge device -->
  <rect x="280" y="86" width="1100" height="770" rx="16" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="300" y="110" font-size="14" font-weight="700" fill="#334155">Edge device · Intel® Core™ Ultra · Ubuntu 24.04 · Docker</text>

  <!-- Internal network -->
  <rect x="300" y="124" width="880" height="556" rx="14" fill="none" stroke="#0068b5" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="318" y="146" font-size="12.5" font-weight="600" fill="#0068b5">Docker network “medical-scribe” (internal: only the gateway publishes a port)</text>

  <!-- Legend -->
  <rect x="30" y="96" width="230" height="168" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="118" class="t" font-size="13">Legend</text>
  <line x1="44" y1="138" x2="94" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="102" y="142" class="lbl">HTTP / REST call</text>
  <line x1="44" y1="162" x2="94" y2="162" stroke="#0068b5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <text x="102" y="166" class="lbl">streaming (WS / SSE)</text>
  <line x1="44" y1="186" x2="94" y2="186" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
  <text x="102" y="190" class="lbl">metrics</text>
  <line x1="44" y1="210" x2="94" y2="210" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#arrow-grey)"/>
  <text x="102" y="214" class="lbl">runs on device / storage</text>
  <rect x="44" y="228" width="34" height="18" rx="9" fill="#0068b5"/>
  <text x="61" y="241" class="pill" text-anchor="middle">GPU</text>
  <text x="86" y="242" class="lbl">default accelerator</text>

  <!-- Clients -->
  <rect x="30" y="292" width="230" height="122" class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="46" y="318" class="t">Clinician browser</text>
  <text x="46" y="340" class="s">Today · Consultations · System</text>
  <text x="46" y="358" class="s">microphone → 16 kHz PCM (live)</text>
  <text x="46" y="376" class="s">upload recordings · edit / review</text>
  <text x="46" y="394" class="s">SOAP notes</text>

  <rect x="30" y="448" width="230" height="84" class="box" fill="#ffffff" stroke="#6c8ebf" stroke-dasharray="6 4"/>
  <text x="46" y="474" class="t">EHR / other clients</text>
  <text x="46" y="496" class="s">same REST API (/api)</text>
  <text x="46" y="514" class="s">e.g. batch notes, integrations</text>

  <rect x="30" y="700" width="230" height="96" class="box" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="46" y="726" class="t">Hugging Face Hub</text>
  <text x="46" y="748" class="s">models, first start only</text>
  <text x="46" y="766" class="s">(Whisper, pyannote, Qwen3)</text>
  <text x="46" y="784" class="s">via corporate proxy</text>

  <!-- Gateway -->
  <rect x="318" y="320" width="182" height="134" class="box" fill="#e8f5e9" stroke="#43a047"/>
  <text x="334" y="346" class="t">gateway</text>
  <text x="334" y="366" class="m">:8080 (127.0.0.1)</text>
  <text x="334" y="386" class="s">nginx · single entry point</text>
  <text x="334" y="404" class="s">/ → ui</text>
  <text x="334" y="422" class="s">/api → scribe-aggregator</text>
  <text x="334" y="440" class="s">place for TLS + auth</text>

  <!-- UI -->
  <rect x="550" y="160" width="260" height="84" class="box" fill="#e8f5e9" stroke="#43a047"/>
  <text x="566" y="186" class="t">ui</text>
  <text x="590" y="186" class="m">:3000</text>
  <text x="566" y="206" class="s">Next.js · presentation only</text>
  <text x="566" y="224" class="s">calls only /api</text>

  <!-- Aggregator -->
  <rect x="550" y="290" width="260" height="244" class="box" fill="#e6f1fb" stroke="#0068b5" stroke-width="2.4"/>
  <text x="566" y="318" class="t" fill="#00285a">scribe-aggregator</text>
  <text x="566" y="338" class="m">:8000 · FastAPI</text>
  <text x="566" y="360" class="s" font-weight="600">The Medical Scribe API</text>
  <text x="566" y="382" class="s">• encounters &amp; doctors</text>
  <text x="566" y="400" class="s">• pipeline: speech to text + speakers</text>
  <text x="566" y="418" class="s">• Doctor / Patient labels</text>
  <text x="566" y="436" class="s">• live sessions (WS relay)</text>
  <text x="566" y="454" class="s">• SOAP note (SSE stream)</text>
  <text x="566" y="472" class="s">• prompt: configs/model-config.yaml</text>
  <text x="566" y="490" class="s">• per-stage timings (RTF, TTFT,</text>
  <text x="566" y="508" class="s">   tokens/s) · metrics proxy</text>

  <!-- Speech to text -->
  <rect x="880" y="160" width="280" height="216" class="box" fill="#fff7e0" stroke="#d6a400"/>
  <text x="896" y="186" class="t">speech-to-text</text>
  <text x="1032" y="186" class="m">:8002</text>
  <rect x="1110" y="172" width="38" height="18" rx="9" fill="#0068b5"/>
  <text x="1129" y="185" class="pill" text-anchor="middle">GPU</text>
  <text x="896" y="206" class="s">intel/audio-analyzer:medical-scribe (OEP)</text>
  <text x="896" y="224" class="s">Whisper large-v3-turbo · int8 · OpenVINO</text>
  <text x="896" y="242" class="s">pyannote community-1 · whole recording</text>
  <text x="896" y="260" class="s">doctor voice profile → Doctor / Patient</text>
  <text x="896" y="284" class="m">/v1/audio/transcriptions</text>
  <text x="896" y="300" class="m">/v1/audio/speaker-embedding</text>
  <text x="896" y="316" class="m">WS /v1/realtime</text>
  <text x="896" y="340" class="s">models: Whisper, pyannote (HF_TOKEN)</text>
  <text x="896" y="358" class="s">GPU driver 26.18 (validated)</text>

  <!-- LLM -->
  <rect x="880" y="392" width="280" height="104" class="box" fill="#fff7e0" stroke="#d6a400"/>
  <text x="896" y="418" class="t">text-generation</text>
  <text x="1030" y="418" class="m">:8004</text>
  <rect x="1110" y="404" width="38" height="18" rx="9" fill="#0068b5"/>
  <text x="1129" y="417" class="pill" text-anchor="middle">GPU</text>
  <text x="896" y="438" class="s">openvino/model_server:2026.4.1-gpu</text>
  <text x="896" y="456" class="s">Qwen3-4B int4 · loaded at start</text>
  <text x="896" y="476" class="m">/v3/chat/completions (stream)</text>

  <!-- Encounter store -->
  <rect x="880" y="512" width="280" height="96" class="box" fill="#fff7e0" stroke="#d6a400"/>
  <text x="896" y="538" class="t">encounter-store</text>
  <text x="1040" y="538" class="m">:8001</text>
  <text x="896" y="558" class="s">FastAPI + SQLite (sole data owner)</text>
  <text x="896" y="576" class="s">encounters · transcripts · notes</text>
  <text x="896" y="594" class="s">doctor profiles · voice prints</text>

  <!-- Hardware -->
  <rect x="1200" y="160" width="160" height="340" rx="12" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.6"/>
  <text x="1216" y="186" class="t">Hardware</text>
  <rect x="1216" y="204" width="128" height="74" rx="10" fill="#ffffff" stroke="#8e44ad"/>
  <text x="1232" y="230" class="t" font-size="14">CPU</text>
  <text x="1232" y="250" class="s">embeddings,</text>
  <text x="1232" y="266" class="s">services</text>
  <rect x="1216" y="294" width="128" height="74" rx="10" fill="#ffffff" stroke="#8e44ad"/>
  <text x="1232" y="320" class="t" font-size="14">iGPU</text>
  <text x="1232" y="338" class="s">Whisper, LLM,</text>
  <text x="1232" y="352" class="s">pyannote</text>
  <text x="1232" y="364" class="m">/dev/dri</text>
  <rect x="1216" y="384" width="128" height="74" rx="10" fill="#ffffff" stroke="#8e44ad"/>
  <text x="1232" y="410" class="t" font-size="14">NPU</text>
  <text x="1232" y="430" class="s">optional</text>
  <text x="1232" y="446" class="m">/dev/accel</text>
  <text x="1216" y="486" class="s">GPU driver 26.18</text>

  <!-- Metrics collector (host network) -->
  <rect x="550" y="700" width="300" height="122" class="box" fill="#fdecea" stroke="#c0392b" stroke-dasharray="6 4"/>
  <text x="566" y="726" class="t">metrics-collector</text>
  <text x="712" y="726" class="m">:9000</text>
  <text x="566" y="746" class="s">performance-tools (intel/retail-benchmark)</text>
  <text x="566" y="764" class="s">CPU · GPU · NPU · memory · power</text>
  <text x="566" y="782" class="s">host network · privileged · /sys, /proc</text>
  <text x="566" y="806" class="s" font-style="italic">same as multi_modal_patient_monitoring</text>

  <!-- Volumes -->
  <path d="M310,712 a105,12 0 0,1 210,0 v86 a105,12 0 0,1 -210,0 z" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <path d="M310,712 a105,12 0 0,0 210,0" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="326" y="746" class="t" font-size="13.5">Host volumes</text>
  <text x="326" y="766" class="m">models/ data/ logs/</text>
  <text x="326" y="782" class="m">metrics/ configs/</text>
  <text x="326" y="798" class="s">bind-mounted</text>

  <!-- Arrows: clients -->
  <line x1="260" y1="352" x2="316" y2="370" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="260" y1="392" x2="316" y2="408" stroke="#0068b5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <text x="168" y="432" class="lbl" fill="#0068b5">WS /api/live</text>
  <text x="262" y="340" class="lbl">HTTP</text>
  <line x1="260" y1="488" x2="316" y2="440" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="748" x2="306" y2="748" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#arrow-grey)"/>

  <!-- Arrows: gateway -->
  <polyline points="409,320 409,202 546,202" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="196" class="lbl">/</text>
  <line x1="500" y1="390" x2="546" y2="390" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="506" y="380" class="lbl">/api</text>
  <line x1="500" y1="420" x2="546" y2="420" stroke="#0068b5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>

  <!-- Arrows: aggregator to services -->
  <line x1="810" y1="320" x2="876" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="436" x2="876" y2="444" stroke="#0068b5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <line x1="810" y1="500" x2="876" y2="556" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: metrics -->
  <line x1="700" y1="534" x2="700" y2="696" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
  <text x="708" y="620" class="lbl" fill="#c0392b">GET /metrics</text>
  <text x="708" y="636" class="lbl" fill="#c0392b">(host.docker.internal:9000)</text>
  <polyline points="850,760 1280,760 1280,504" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>
  <text x="980" y="752" class="lbl" fill="#c0392b">reads hardware counters</text>

  <!-- Arrows: devices -->
  <line x1="1160" y1="212" x2="1214" y2="320" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#arrow-grey)"/>
  <line x1="1160" y1="328" x2="1214" y2="250" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#arrow-grey)"/>
  <line x1="1160" y1="444" x2="1214" y2="344" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#arrow-grey)"/>
  <line x1="1160" y1="444" x2="1214" y2="420" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#arrow-grey)"/>

  <!-- Footer -->
  <text x="300" y="844" class="s">Flow: record / upload → transcription + speakers (doctor voice profile) → encounter-store → SOAP note streamed to the browser</text>
</svg>
