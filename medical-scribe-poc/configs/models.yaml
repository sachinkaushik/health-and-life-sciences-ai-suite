# Models used by the Medical Scribe. `make download-models` reads this file.
# Paths are relative to the medical-scribe-poc folder; the app looks for models in these places.

huggingface_home: models/huggingface

models:
  text-generation:
    enabled: true
    repo: OpenVINO/Qwen3-8B-int8-ov
    # ovms-pull: OpenVINO Model Server downloads (and converts if needed) into dest
    method: ovms-pull
    dest: models/multiserve/text-generation/OV
    task: text_generation
    target_device: GPU
    # weight_format: int4   # only for models not already in OpenVINO format

  diarization:
    enabled: true
    repo: pyannote/speaker-diarization-community-1
    method: snapshot
    dest: models/diarization/pyannote/speaker-diarization-community-1
    # gated on Hugging Face: accept the terms, then provide HF_TOKEN
    requires_token: true

  speech-to-text:
    enabled: true
    repo: openai/whisper-large-v3-turbo
    # hf-cache: into the shared Hugging Face cache; the service converts it to OpenVINO on first start
    method: hf-cache
