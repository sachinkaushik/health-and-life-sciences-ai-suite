services:
  patient-monitoring-assets:
    build:
      context: ./services/patient-monitoring-assets
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: intel/hl-ai-patient-monitoring-assets:${TAG}
    container_name: patient-monitoring-assets
    environment:
      - MODEL_CONFIG_PATH=/app/configs/model-config.yaml
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./configs/model-config.yaml:/app/configs/model-config.yaml:ro
      - ./models:/models
      - ./videos:/videos
      - ./models:/root/.cache/huggingface
  
  patient-monitoring-aggregator:
    build:
      context: ./services/patient-monitoring-aggregator
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: intel/hl-ai-patient-monitoring-aggregator:${TAG}
    container_name: patient-monitoring-aggregator
    environment:
      - WORKLOAD_TYPE=mdpnp
      - GRPC_PORT=50051
      - HTTP_PORT=8001
      # Device source control endpoint: dds-bridge (:8082, openice) or sdc-bridge (:8092, sdc).
      - DDS_BRIDGE_CONTROL_URL=${DEVICE_CONTROL_URL:-http://localhost:8082}
      - AI_ECG_URL=${AGGREGATOR_AI_ECG_URL:-http://localhost:8000/predict_stream_next}
    network_mode: "host"
    
  metrics-collector:
    # Live-metrics HTTP API (CPU/GPU/NPU/memory/power on :9000) lives upstream in
    # intel-retail/performance-tools and is published as intel/retail-benchmark,
    # so we consume that image directly -- no local build required.
    image: intel/retail-benchmark:${TAG}
    container_name: metrics-collector
    privileged: true
    pid: host
    network_mode: "host"
    environment:
      - NPU_LOG=/tmp/results/npu_usage.csv
      - RESULTS_DIR=/tmp/results                # live-metrics reads here (was METRICS_DIR)
      - DEVICE_CONFIG_PATH=/configs/device.env  # powers GET /device-config (was DEVICE_ENV_PATH)
      - QMASSA_CYCLE_SECONDS=180                # bound the qmassa JSON (replaces the custom collect_gpu.sh)
    volumes:
      - ./metrics:/tmp/results
      - ./configs:/configs
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /sys/devices:/sys/devices
      - /dev/dri:/dev/dri:rw
      - /sys/class/drm:/sys/class/drm:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/proc

  mdpnp:
    build:
      context: ./services/mdpnp
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: intel/hl-ai-mdpnp:${TAG}
    container_name: mdpnp
    profiles: ["openice"]
    network_mode: "host"
    depends_on:
        patient-monitoring-assets:
          condition: service_completed_successfully
        patient-monitoring-aggregator:
          condition: service_started  

  dds-bridge:
    build:
      context: ./services/dds-bridge
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: intel/hl-ai-dds-bridge:${TAG}
    container_name: dds-bridge
    profiles: ["openice"]
    environment:
      - GRPC_HOST=localhost
      - GRPC_PORT=50051
      - MDPNP_DEVICE=${MDPNP_DEVICE:-}
    env_file:
        - ./configs/device.env   
    depends_on:
      patient-monitoring-aggregator:
        condition: service_started
      mdpnp:
        condition: service_started
    network_mode: "host"

  # IEEE 11073 SDC device path (DEVICE_SOURCE=sdc): SDC provider + SDC consumer feeding the aggregator.
  sdc-gateway:
    build:
      context: ./services/sdc-gateway
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: intel/hl-ai-sdc-gateway:${TAG}
    container_name: sdc-gateway
    profiles: ["sdc"]
    network_mode: "host"
    environment:
      - SDC_BIND_IP=${SDC_BIND_IP:-}
      - SDC_SSL_DIR=${SDC_SSL_DIR:-}
      - RPPG_GRPC_PORT=50061
      - AI_ECG_URL=http://localhost:8000/predict_stream_next

  sdc-bridge:
    build:
      context: ./services/sdc-bridge
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: intel/hl-ai-sdc-bridge:${TAG}
    container_name: sdc-bridge
    profiles: ["sdc"]
    network_mode: "host"
    environment:
      - SDC_BIND_IP=${SDC_BIND_IP:-}
      - SDC_SSL_DIR=${SDC_SSL_DIR:-}
      - GRPC_HOST=localhost
      - GRPC_PORT=50051
      - CONTROL_PORT=8092
    depends_on:
      patient-monitoring-aggregator:
        condition: service_started
      sdc-gateway:
        condition: service_started

  ai-ecg:
    build:
      context: ./services/ai-ecg/backend
      dockerfile: Dockerfile
      args:
        INSTALL_DRIVER_VERSION: "26.27.39122"
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: intel/hl-ai-ecg:${TAG}
    container_name: ai-ecg
    network_mode: "host"
    depends_on:
      patient-monitoring-assets:
        condition: service_completed_successfully
      patient-monitoring-aggregator:
        condition: service_started
    environment:
      - ECG_DEVICE=${ECG_DEVICE:-}  
    env_file:
      - ./configs/device.env  
    volumes:
      - ./models:/models
      - ./videos:/videos
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - video

  3dpose-estimation:
      build:
        context: ./services/3d-pose-estimation
        dockerfile: Dockerfile
        args:
          HTTP_PROXY: ${HTTP_PROXY}
          HTTPS_PROXY: ${HTTPS_PROXY}
          NO_PROXY: ${NO_PROXY}
          INSTALL_DRIVER_VERSION: "26.27.39122"
      image: intel/hl-ai-3dpose:${TAG}
      container_name: 3dpose-estimation
      network_mode: "host"
      environment:
        - VIDEO_FILE=/videos/3d-pose/face-demographics-walking.mp4
        - MODEL_PATH=/models/3d-pose/human-pose-estimation-3d-0001.xml
        - AGGREGATOR_ADDRESS=localhost:50051
        - SOURCE_ID=3d-pose-camera-1
        - DEVICE_CONFIG_PATH=/app/configs/device.yaml
        - DEPLOYMENT_ENV=production
        - POSE_3D_DEVICE=${POSE_3D_DEVICE:-GPU}
        - CONTROL_PORT=8083     
      env_file:
        - ./configs/device.env
      depends_on:
        patient-monitoring-assets:
          condition: service_completed_successfully
        patient-monitoring-aggregator:
          condition: service_started
      volumes:
        - ./models:/models
        - ./videos:/videos 
      devices:
        - "/dev/dri:/dev/dri"
      group_add:
        - video
  
  rppg:
    build:
      context: ./services/rppg
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: intel/hl-ai-rppg:${TAG}
    container_name: rppg
    network_mode: "host"
    depends_on:
      patient-monitoring-assets:
        condition: service_completed_successfully
      patient-monitoring-aggregator:
          condition: service_started  
      sdc-gateway:
        condition: service_started
        required: false
    environment:
      - RPPG_DEVICE=${RPPG_DEVICE:-}  
      # 50051 = aggregator (openice); 50061 = sdc-gateway (sdc).
      - AGGREGATOR_PORT=${RPPG_AGGREGATOR_PORT:-50051}
    env_file:
      - ./configs/device.env  
    volumes:
      - ./models:/models
      - ./videos:/videos
    devices:
      - "/dev/dri:/dev/dri" 
    group_add:
      - video      
   
  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: intel/hl-ai-ui:${TAG}
    container_name: ui
    # nginx in this image reverse-proxies /api/ and /pose-stream/ to the
    # aggregator (host port 8001) and 3D-pose service (host port 8085).
    # host-gateway lets the bridge-network UI reach those host-mode services.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      patient-monitoring-aggregator:
        condition: service_started
      mdpnp:
        condition: service_started
        required: false
      dds-bridge:
        condition: service_started
        required: false
      sdc-bridge:
        condition: service_started
        required: false
      ai-ecg:
        condition: service_started
      3dpose-estimation:
        condition: service_started
      rppg:
        condition: service_started    
